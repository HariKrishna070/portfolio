<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDB6E"/>
      <stop offset="100%" stop-color="#FF9B26"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b176f2"/>
      <stop offset="100%" stop-color="#7352f5"/>
    </linearGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" stroke="#33333d" stroke-width="2"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(30, 30)">
    <!-- Tree Logo Icon -->
    <rect width="44" height="44" rx="12" fill="#26231c" stroke="#FFDB6E" stroke-width="1.5"/>
    <circle cx="22" cy="16" r="4" fill="#FFDB6E" filter="url(#glowGold)"/>
    <circle cx="14" cy="28" r="3.5" fill="#4facfe"/>
    <circle cx="30" cy="28" r="3.5" fill="#38ef7d"/>
    <line x1="22" y1="16" x2="14" y2="28" stroke="#FFDB6E" stroke-width="1.5"/>
    <line x1="22" y1="16" x2="30" y2="28" stroke="#FFDB6E" stroke-width="1.5"/>
    <line x1="22" y1="28" x2="22" y2="38" stroke="#FFDB6E" stroke-width="2"/>

    <!-- Title and Subtitle -->
    <text x="56" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">ConvoTree</text>
    <text x="56" y="40" fill="#a0a0b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">Agentic AI Conversation &amp; Cognitive Memory Platform</text>

    <!-- Top-right badges -->
    <rect x="580" y="6" width="75" height="26" rx="13" fill="#1b2a22" stroke="#38ef7d" stroke-width="1"/>
    <circle cx="592" cy="19" r="4" fill="#38ef7d"/>
    <text x="602" y="23" fill="#38ef7d" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">ACTIVE</text>

    <rect x="665" y="6" width="75" height="26" rx="13" fill="#252118" stroke="#FFDB6E" stroke-width="1"/>
    <text x="677" y="23" fill="#FFDB6E" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">v2.4 AI</text>
  </g>

  <!-- Neural Tree / Workflow Visualization -->
  <!-- Connection Bezier Curves -->
  <g fill="none" stroke-linecap="round" opacity="0.8">
    <!-- Root to Branch 1 -->
    <path d="M 170 240 C 230 240, 230 140, 290 140" stroke="url(#blueGrad)" stroke-width="2.5" stroke-dasharray="6,4"/>
    <!-- Root to Branch 2 -->
    <path d="M 170 240 C 230 240, 230 240, 290 240" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glowGold)"/>
    <!-- Root to Branch 3 -->
    <path d="M 170 240 C 230 240, 230 340, 290 340" stroke="url(#purpleGrad)" stroke-width="2.5" stroke-dasharray="6,4"/>

    <!-- Branch 2 to Sub-leaves -->
    <path d="M 480 240 C 530 240, 530 170, 570 170" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M 480 240 C 530 240, 530 240, 570 240" stroke="url(#cyanGrad)" stroke-width="2"/>
    <path d="M 480 240 C 530 240, 530 310, 570 310" stroke="url(#blueGrad)" stroke-width="2"/>

    <!-- Branch 1 to Sub-leaf -->
    <path d="M 460 140 C 510 140, 520 120, 570 120" stroke="url(#blueGrad)" stroke-width="1.8"/>

    <!-- Branch 3 to Sub-leaf -->
    <path d="M 470 340 C 520 340, 520 360, 570 360" stroke="url(#purpleGrad)" stroke-width="1.8"/>
  </g>

  <!-- Nodes -->
  <!-- Root Node: User Intent & Session Root -->
  <g transform="translate(60, 205)">
    <rect width="130" height="70" rx="14" fill="#1b1c24" stroke="#FFDB6E" stroke-width="2" filter="url(#glowGold)"/>
    <circle cx="28" cy="35" r="14" fill="url(#goldGrad)"/>
    <text x="28" y="40" text-anchor="middle" fill="#141416" font-family="sans-serif" font-size="14" font-weight="900">⚡</text>
    <text x="50" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Root Session</text>
    <text x="50" y="48" fill="#FFDB6E" font-family="sans-serif" font-size="10" font-weight="500">Agentic Flow</text>
  </g>

  <!-- Node 1: Hierarchical Context / Mem0 -->
  <g transform="translate(290, 110)">
    <rect width="180" height="60" rx="12" fill="#151d28" stroke="#4facfe" stroke-width="1.5"/>
    <circle cx="24" cy="30" r="10" fill="url(#blueGrad)"/>
    <text x="24" y="34" text-anchor="middle" fill="#141416" font-family="sans-serif" font-size="10" font-weight="bold">M</text>
    <text x="44" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Mem0 Memory Bank</text>
    <text x="44" y="44" fill="#8ec5fc" font-family="sans-serif" font-size="10">Hierarchical Context</text>
  </g>

  <!-- Node 2: Multi-Provider LLM Orchestrator -->
  <g transform="translate(290, 205)">
    <rect width="190" height="70" rx="12" fill="#252119" stroke="#FFDB6E" stroke-width="2"/>
    <circle cx="26" cy="35" r="12" fill="url(#goldGrad)"/>
    <text x="26" y="40" text-anchor="middle" fill="#141416" font-family="sans-serif" font-size="12" font-weight="bold">✦</text>
    <text x="48" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">LLM Orchestration</text>
    <text x="48" y="48" fill="#FFDB6E" font-family="sans-serif" font-size="10">Branch-aware Reasoning</text>
  </g>

  <!-- Node 3: SSE Streaming Engine -->
  <g transform="translate(290, 310)">
    <rect width="180" height="60" rx="12" fill="#1d1728" stroke="#b176f2" stroke-width="1.5"/>
    <circle cx="24" cy="30" r="10" fill="url(#purpleGrad)"/>
    <text x="24" y="34" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">▶</text>
    <text x="44" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600">Async SSE Streaming</text>
    <text x="44" y="44" fill="#cbb2fe" font-family="sans-serif" font-size="10">Recursive SQL CTEs</text>
  </g>

  <!-- Sub-Leaf Nodes (Right Column) -->
  <g transform="translate(570, 100)">
    <rect width="165" height="40" rx="8" fill="#141c24" stroke="#38ef7d" stroke-width="1"/>
    <text x="14" y="25" fill="#e0e0e0" font-family="sans-serif" font-size="11" font-weight="600">🧠 Deterministic Context</text>
  </g>

  <g transform="translate(570, 150)">
    <rect width="165" height="40" rx="8" fill="#1a1c24" stroke="#4facfe" stroke-width="1"/>
    <text x="14" y="25" fill="#e0e0e0" font-family="sans-serif" font-size="11" font-weight="600">🤖 OpenAI • Anthropic • Gemini</text>
  </g>

  <g transform="translate(570, 220)">
    <rect width="165" height="40" rx="8" fill="#241e17" stroke="#FFDB6E" stroke-width="1"/>
    <text x="14" y="25" fill="#FFDB6E" font-family="sans-serif" font-size="11" font-weight="600">⚡ Local Ollama Inference</text>
  </g>

  <g transform="translate(570, 290)">
    <rect width="165" height="40" rx="8" fill="#18231c" stroke="#38ef7d" stroke-width="1"/>
    <text x="14" y="25" fill="#e0e0e0" font-family="sans-serif" font-size="11" font-weight="600">🌿 Interactive SVG Tree</text>
  </g>

  <g transform="translate(570, 345)">
    <rect width="165" height="40" rx="8" fill="#201726" stroke="#b176f2" stroke-width="1"/>
    <text x="14" y="25" fill="#e0e0e0" font-family="sans-serif" font-size="11" font-weight="600">⚛️ React + TS + Zustand</text>
  </g>

  <!-- Bottom Technology Stack Bar -->
  <g transform="translate(30, 430)">
    <rect width="740" height="45" rx="10" fill="#18181c" stroke="#2d2d38" stroke-width="1"/>
    <text x="20" y="27" fill="#888899" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">TECH STACK:</text>
    
    <g transform="translate(115, 10)">
      <rect width="70" height="25" rx="6" fill="#23232c"/>
      <text x="35" y="17" text-anchor="middle" fill="#FFDB6E" font-family="sans-serif" font-size="10" font-weight="600">FastAPI</text>
    </g>
    <g transform="translate(195, 10)">
      <rect width="75" height="25" rx="6" fill="#23232c"/>
      <text x="37.5" y="17" text-anchor="middle" fill="#4facfe" font-family="sans-serif" font-size="10" font-weight="600">Python</text>
    </g>
    <g transform="translate(280, 10)">
      <rect width="85" height="25" rx="6" fill="#23232c"/>
      <text x="42.5" y="17" text-anchor="middle" fill="#38ef7d" font-family="sans-serif" font-size="10" font-weight="600">SQLAlchemy</text>
    </g>
    <g transform="translate(375, 10)">
      <rect width="70" height="25" rx="6" fill="#23232c"/>
      <text x="35" y="17" text-anchor="middle" fill="#b176f2" font-family="sans-serif" font-size="10" font-weight="600">Mem0</text>
    </g>
    <g transform="translate(455, 10)">
      <rect width="80" height="25" rx="6" fill="#23232c"/>
      <text x="40" y="17" text-anchor="middle" fill="#FFDB6E" font-family="sans-serif" font-size="10" font-weight="600">LangGraph</text>
    </g>
    <g transform="translate(545, 10)">
      <rect width="90" height="25" rx="6" fill="#23232c"/>
      <text x="45" y="17" text-anchor="middle" fill="#4facfe" font-family="sans-serif" font-size="10" font-weight="600">React + TS</text>
    </g>
    <g transform="translate(645, 10)">
      <rect width="75" height="25" rx="6" fill="#23232c"/>
      <text x="37.5" y="17" text-anchor="middle" fill="#38ef7d" font-family="sans-serif" font-size="10" font-weight="600">Zustand</text>
    </g>
  </g>
</svg>
